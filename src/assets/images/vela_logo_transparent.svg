<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <defs>
    <!-- Left Sail Gradient: rich darker crimson shading -->
    <linearGradient id="velaLeftSailGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#7a0a10" />
      <stop offset="35%" stop-color="#941018" />
      <stop offset="75%" stop-color="#b81620" />
      <stop offset="100%" stop-color="#c91a24" />
    </linearGradient>

    <!-- Right Sail Gradient: vibrant crimson with bright highlight -->
    <linearGradient id="velaRightSailGrad" x1="25%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#eb252e" />
      <stop offset="40%" stop-color="#d91e26" />
      <stop offset="75%" stop-color="#b8141c" />
      <stop offset="100%" stop-color="#880a10" />
    </linearGradient>

    <!-- Bottom Wave Swoosh Gradient: crimson wave -->
    <linearGradient id="velaSwooshGrad" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#991019" />
      <stop offset="30%" stop-color="#b8151e" />
      <stop offset="60%" stop-color="#cf1a23" />
      <stop offset="85%" stop-color="#dd2028" />
      <stop offset="100%" stop-color="#bd161f" />
    </linearGradient>
  </defs>

  <!-- Group containing the sail symbol -->
  <g id="vela-symbol">
    <!-- Left Sail (Jib) -->
    <path 
      d="M 480 282 C 472 370 420 500 356 598 C 390 595 430 591 462 586 C 476 495 484 390 480 282 Z" 
      fill="url(#velaLeftSailGrad)" 
    />

    <!-- Right Sail (Mainsail) -->
    <path 
      d="M 534 224 C 530 310 508 440 486 580 C 525 572 575 562 626 550 C 638 480 638 350 534 224 Z" 
      fill="url(#velaRightSailGrad)" 
    />

    <!-- Bottom Wave Swoosh -->
    <path 
      d="M 260 620 C 315 648 368 658 412 658 C 490 658 620 626 758 597 C 675 607 560 624 475 628 C 410 630 335 620 260 620 Z" 
      fill="url(#velaSwooshGrad)" 
    />
  </g>

  <!-- Typography: AGÊNCIA VELA -->
  <g id="vela-text">
    <text 
      x="500" 
      y="805" 
      text-anchor="middle" 
      font-family="'Montserrat', 'Liberation Sans', 'FreeSans', -apple-system, sans-serif" 
      font-size="48" 
      font-weight="400" 
      letter-spacing="0.28em"
    >
      <tspan fill="#FFFFFF">AGÊNCIA </tspan>
      <tspan fill="#D01E27">VELA</tspan>
    </text>
  </g>
</svg>